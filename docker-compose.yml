x-dns: &app-dns
  - 8.8.8.8
  - 8.8.4.4
  - 1.1.1.1
  - 172.17.0.1

services:
  db:
    image: postgres:14-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - ./app.env

  redis:
    image: redis:6-alpine

  web:
    build: .
    entrypoint: ["bash", "/app/docker-entrypoint.sh"]
    command: >
      sh -c "
        while ! nc -z db 5432; do sleep 0.1; done &&
        python manage.py migrate &&
        gunicorn tax_service.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 300
      "
    volumes:
      - .:/app
      - ./media:/app/media
      # Только ключи с хоста; /etc/opt/cprocsp и остальной /var/opt/cprocsp — из образа
      - /var/opt/cprocsp/keys:/var/opt/cprocsp/keys
      # uMy (my.sto) — иначе после recreate контейнера PrivateKey Link пропадает
      - cprocsp_users:/var/opt/cprocsp/users
      # Конфигурация CSP и лицензия. Должны переживать recreate контейнера.
      - cprocsp_config:/etc/opt/cprocsp
    ports:
      # Внешние клиенты должны обращаться через HTTPS Nginx. Прямой Gunicorn
      # нельзя публиковать в интернет: иначе обходятся TLS, rate-limit и auth.
      - "127.0.0.1:8000:8000"
    env_file:
      - ./app.env
    depends_on:
      - db
      - redis
    user: root
    dns: *app-dns

  worker:
    build: .
    entrypoint: ["bash", "/app/docker-entrypoint.sh"]
    command: celery -A tax_service worker -l info
    volumes:
      - .:/app
      - /var/opt/cprocsp/keys:/var/opt/cprocsp/keys
      - cprocsp_users:/var/opt/cprocsp/users
      - cprocsp_config:/etc/opt/cprocsp
    env_file:
      - ./app.env
    depends_on:
      - redis
      - db
    user: root
    dns: *app-dns

  beat:
    build: .
    entrypoint: ["bash", "/app/docker-entrypoint.sh"]
    command: celery -A tax_service beat -l info
    volumes:
      - .:/app
      - /var/opt/cprocsp/keys:/var/opt/cprocsp/keys
      - cprocsp_users:/var/opt/cprocsp/users
      - cprocsp_config:/etc/opt/cprocsp
    env_file:
      - ./app.env
    depends_on:
      - redis
      - db
    user: root
    dns: *app-dns

volumes:
  postgres_data:
  cprocsp_users:
  cprocsp_config:
